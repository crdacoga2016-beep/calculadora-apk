name: Compilar APK de Calculadora

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # También permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta www con los archivos web
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/

      - name: Añadir plataforma Android
        run: npx cap add android

      - name: Sincronizar assets web y dependencias
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x ./android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

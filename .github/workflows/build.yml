name: Compilar APK de Calculadora

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar herramienta de iconos
        run: npm install @capacitor/assets --save-dev

      - name: Preparar carpeta www con los archivos web
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/

      - name: Añadir plataforma Android
        run: npx cap add android

      - name: Generar iconos de la app
        run: |
          mkdir -p assets
          cp icono.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Sincronizar assets web y dependencias
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x ./android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact (Para ti)
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Crear Release Público y subir el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Calculadora Oficial
          body: "Descarga la calculadora con doble cero. Sin anuncios, sin marcas de agua."
          files: android/app/build/outputs/apk/debug/app-debug.apk
